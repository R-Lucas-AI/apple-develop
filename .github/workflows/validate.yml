name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate_public_skill.py
      - run: python3 skills/apple-develop/scripts/check_inquiry_trace.py tests/fixtures/valid-trace.json
      - run: python3 scripts/build_skillhub_package.py
